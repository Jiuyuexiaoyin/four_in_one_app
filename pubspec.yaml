name: four_in_one_app
description: "Get Ready is a local-first personal productivity app for habits, planning, focus, review, and reminders."
publish_to: 'none'
version: 2.6.0+18

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^21.0.0
  image_picker: ^1.2.1
  image_picker_android: ^0.8.13+17
  image_picker_platform_interface: ^2.11.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/generated/get_ready_mark_64.png
