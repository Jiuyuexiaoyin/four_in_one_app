name: AI Task

on:
  workflow_dispatch:
    inputs:
      task_file:
        description: Task file under ai/tasks
        required: true
        default: sample_P7H_2.md
      execute:
        description: Run enabled execute paths instead of dry-run
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      probe_codex:
        description: Probe Codex CLI availability on the runner
        required: true
        default: true
        type: boolean
      use_images:
        description: Build and attach a task-specific visual image pack
        required: true
        default: false
        type: boolean
      task_pack:
        description: Visual task image pack
        required: true
        default: global
        type: choice
        options:
          - global
          - habits
          - today
          - plan
          - focus
          - review
      team_loop:
        description: Run AI-AUTO-1.0 controlled team loop orchestrator
        required: true
        default: false
        type: boolean
      task_type:
        description: TaskType for guard/verifier/team loop
        required: true
        default: audit
        type: choice
        options:
          - probe
          - audit
          - workflow
          - docs
          - code_implementation
          - ui_implementation
          - release
      enable_fixer:
        description: Allow bounded fixer loop in team_loop mode
        required: true
        default: false
        type: boolean
      max_fix_loops:
        description: Maximum fixer loops in team_loop mode
        required: true
        default: "2"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
      verification_profile:
        description: Verification profile for team_loop mode
        required: true
        default: none
        type: choice
        options:
          - none
          - audit
          - habits
          - ui-smoke
          - full
      allowed_file_list:
        description: Optional repo-relative path to exact allowed file list
        required: false
        default: ""

jobs:
  team_loop:
    if: ${{ inputs.team_loop == true }}
    runs-on: [self-hosted, windows, x64, four-in-one]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner info
        shell: powershell
        run: |
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Host "GITHUB_WORKSPACE=$env:GITHUB_WORKSPACE"
          Write-Host "AGENT_ROLE=TeamLoop"

      - name: Probe Codex CLI
        if: ${{ inputs.probe_codex == true }}
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "D:\AI\Projects\four_in_one_app\ai\scripts\check_codex_env.ps1"

      - name: Run controlled team loop
        shell: powershell
        run: |
          $taskFileInput = "${{ inputs.task_file }}"
          $taskTypeInput = "${{ inputs.task_type }}"
          $taskPackInput = "${{ inputs.task_pack }}"
          $maxFixLoopsInput = "${{ inputs.max_fix_loops }}"
          $verificationProfileInput = "${{ inputs.verification_profile }}"
          $executeInput = "${{ inputs.execute }}"
          $useImagesInput = "${{ inputs.use_images }}"
          $enableFixerInput = "${{ inputs.enable_fixer }}"
          $allowedFileListInput = "${{ inputs.allowed_file_list }}"
          $teamLoopScript = "D:\AI\Projects\four_in_one_app\ai\scripts\run_ai_team_loop.ps1"

          Write-Host "TASK_FILE_INPUT=$taskFileInput"
          Write-Host "TASK_TYPE_INPUT=$taskTypeInput"
          Write-Host "TASK_PACK_INPUT=$taskPackInput"
          Write-Host "VERIFICATION_PROFILE_INPUT=$verificationProfileInput"
          Write-Host "MAX_FIX_LOOPS_INPUT=$maxFixLoopsInput"
          Write-Host "USE_IMAGES_INPUT=$useImagesInput"
          Write-Host "EXECUTE_INPUT=$executeInput"
          Write-Host "ENABLE_FIXER_INPUT=$enableFixerInput"
          Write-Host "ALLOWED_FILE_LIST_INPUT=$allowedFileListInput"

          $teamLoopParams = @{
            TaskFile = $taskFileInput
            TaskType = $taskTypeInput
            TaskPack = $taskPackInput
            MaxFixLoops = [int]$maxFixLoopsInput
            VerificationProfile = $verificationProfileInput
          }

          if ($executeInput -eq "true") {
            $teamLoopParams["Execute"] = $true
          }

          if ($useImagesInput -eq "true") {
            $teamLoopParams["UseImages"] = $true
          }

          if ($enableFixerInput -eq "true") {
            $teamLoopParams["EnableFixer"] = $true
          }

          if (-not [string]::IsNullOrWhiteSpace($allowedFileListInput)) {
            $teamLoopParams["AllowedFileListPath"] = $allowedFileListInput
          }

          if ($teamLoopParams["TaskType"] -eq $teamLoopParams["TaskFile"]) {
            throw "TEAM_LOOP_PARAMETER_BINDING_BUG: TaskType equals TaskFile"
          }

          if ($teamLoopParams["TaskType"] -notin @("probe","audit","workflow","docs","code_implementation","ui_implementation","release")) {
            throw "TEAM_LOOP_INVALID_TASK_TYPE: $($teamLoopParams["TaskType"])"
          }

          Write-Host "TEAM_LOOP_PARAMS:"
          foreach ($key in ($teamLoopParams.Keys | Sort-Object)) {
            Write-Host ("- {0}: {1}" -f $key, $teamLoopParams[$key])
          }

          & $teamLoopScript @teamLoopParams

      - name: Upload AI task artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-task-reports-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            D:\AI\Projects\four_in_one_app\ai\reports\**
            D:\AI\Projects\four_in_one_app\ai\logs\**
            D:\AI\Projects\four_in_one_app\screenshots\**

  planner:
    if: ${{ inputs.team_loop == false }}
    runs-on: [self-hosted, windows, x64, four-in-one]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner info
        shell: powershell
        run: |
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Host "GITHUB_WORKSPACE=$env:GITHUB_WORKSPACE"
          Write-Host "AGENT_ROLE=Planner"

      - name: Show status
        shell: powershell
        run: |
          & "D:\AI\Projects\four_in_one_app\ai\scripts\show_status.ps1"

      - name: Probe Codex CLI
        if: ${{ inputs.probe_codex == true }}
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "D:\AI\Projects\four_in_one_app\ai\scripts\check_codex_env.ps1"

      - name: Planner dry-run
        shell: powershell
        run: |
          Write-Host "Planner turns the task into scope, constraints, tests, risks, and acceptance criteria."
          Write-Host "Visible linear mode is DRY_RUN/report-first unless execute is enabled for a safe task."
          & "D:\AI\Projects\four_in_one_app\ai\scripts\run_ai_planner.ps1" -TaskFile "${{ github.event.inputs.task_file }}"

  implementer:
    if: ${{ inputs.team_loop == false }}
    needs: planner
    runs-on: [self-hosted, windows, x64, four-in-one]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Implementer role
        shell: powershell
        run: |
          Write-Host "AGENT_ROLE=Implementer"
          Write-Host "Implementer edits only allowed files in enabled execute mode."

      - name: Show status
        shell: powershell
        run: |
          & "D:\AI\Projects\four_in_one_app\ai\scripts\show_status.ps1"

      - name: Implementer
        shell: powershell
        run: |
          $execute = "${{ github.event.inputs.execute }}" -eq "true"
          $useImages = "${{ inputs.use_images }}" -eq "true"
          if ($execute) {
            & "D:\AI\Projects\four_in_one_app\ai\scripts\run_ai_implementer.ps1" -TaskFile "${{ github.event.inputs.task_file }}" -TaskPack "${{ inputs.task_pack }}" -Execute -UseImages:$useImages
          } else {
            & "D:\AI\Projects\four_in_one_app\ai\scripts\run_ai_implementer.ps1" -TaskFile "${{ github.event.inputs.task_file }}" -TaskPack "${{ inputs.task_pack }}" -UseImages:$useImages
          }

  verifier:
    if: ${{ inputs.team_loop == false }}
    needs: implementer
    runs-on: [self-hosted, windows, x64, four-in-one]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verifier role
        shell: powershell
        run: |
          Write-Host "AGENT_ROLE=Verifier"
          Write-Host "Verifier is script/CI output, not model opinion."
          Write-Host "Visible linear verifier remains status-only unless team_loop mode selects a profile."

      - name: Verifier dry-run status
        shell: powershell
        run: |
          & "D:\AI\Projects\four_in_one_app\ai\scripts\show_status.ps1"
          Write-Host "Use team_loop=true with verification_profile to run central verifier."

  reviewer:
    if: ${{ inputs.team_loop == false }}
    needs: verifier
    runs-on: [self-hosted, windows, x64, four-in-one]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reviewer role
        shell: powershell
        run: |
          Write-Host "AGENT_ROLE=Reviewer"
          Write-Host "Reviewer is read-only and must output PASS or FAIL in enabled mode."

      - name: Reviewer
        shell: powershell
        run: |
          $execute = "${{ github.event.inputs.execute }}" -eq "true"
          $useImages = "${{ inputs.use_images }}" -eq "true"
          if ($execute) {
            & "D:\AI\Projects\four_in_one_app\ai\scripts\run_ai_reviewer.ps1" -TaskFile "${{ github.event.inputs.task_file }}" -TaskType "${{ inputs.task_type }}" -Execute -UseImages:$useImages
          } else {
            & "D:\AI\Projects\four_in_one_app\ai\scripts\run_ai_reviewer.ps1" -TaskFile "${{ github.event.inputs.task_file }}" -TaskType "${{ inputs.task_type }}" -UseImages:$useImages
          }

  reporter:
    if: ${{ inputs.team_loop == false }}
    needs: reviewer
    runs-on: [self-hosted, windows, x64, four-in-one]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reporter role
        shell: powershell
        run: |
          Write-Host "AGENT_ROLE=Reporter"
          Write-Host "Reporter summarizes reports and next action. No auto-commit, no auto-merge, no APK."

      - name: Pipeline plan summary
        shell: powershell
        run: |
          $useImages = "${{ inputs.use_images }}" -eq "true"
          & "D:\AI\Projects\four_in_one_app\ai\scripts\run_ai_pipeline.ps1" -TaskFile "${{ github.event.inputs.task_file }}" -TaskPack "${{ inputs.task_pack }}" -UseImages:$useImages

      - name: Reporter
        shell: powershell
        run: |
          $execute = "${{ github.event.inputs.execute }}" -eq "true"
          if ($execute) {
            & "D:\AI\Projects\four_in_one_app\ai\scripts\run_ai_reporter.ps1" -TaskFile "${{ github.event.inputs.task_file }}" -TaskType "${{ inputs.task_type }}" -Execute
          } else {
            & "D:\AI\Projects\four_in_one_app\ai\scripts\run_ai_reporter.ps1" -TaskFile "${{ github.event.inputs.task_file }}" -TaskType "${{ inputs.task_type }}"
          }
